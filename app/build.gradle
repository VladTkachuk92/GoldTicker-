plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vlad.goldticker'
    compileSdk 35

    defaultConfig {
        applicationId "com.vlad.goldticker"
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName "1.4"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
